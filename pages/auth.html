<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập & Đăng ký — EventVN</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#4338CA',
                hover: '#3730A3',
                light: '#EEF2FF',
              }
            },
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
    <!-- Header đơn giản -->
    <header class="bg-white border-b border-slate-200">
      <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-base shadow-sm">
            E
          </div>
          <span class="text-lg font-black tracking-tight text-slate-900">Event<span class="text-indigo-600">VN</span></span>
        </a>
        <a href="index.html" class="text-xs font-semibold text-slate-600 hover:text-indigo-600 transition-colors flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span>Quay lại Trang chủ</span>
        </a>
      </div>
    </header>

    <!-- Main Content Form -->
    <main class="flex-1 flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-md bg-white rounded-3xl border border-slate-200 shadow-xl shadow-slate-100/60 p-6 sm:p-8">
        
        <!-- Tab Chuyển Đăng nhập / Đăng ký -->
        <div class="flex p-1 bg-slate-100 rounded-2xl mb-6">
          <button 
            type="button" 
            id="tab-login-btn"
            onclick="switchAuthTab('login')" 
            class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all bg-white text-indigo-700 shadow-sm"
          >
            Đăng nhập
          </button>
          <button 
            type="button" 
            id="tab-register-btn"
            onclick="switchAuthTab('register')" 
            class="flex-1 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all"
          >
            Đăng ký
          </button>
        </div>

        <!-- Thông báo lỗi / thành công -->
        <div id="auth-alert" class="hidden mb-5 p-3.5 rounded-xl text-xs font-medium border animate-slide-up"></div>

        <!-- ─── FORM ĐĂNG NHẬP ──────────────────────────────────────────────── -->
        <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Địa chỉ Email</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              </div>
              <input 
                type="email" 
                id="login-email" 
                name="email"
                required 
                placeholder="name@example.com" 
                class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white transition-all"
              />
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-semibold text-slate-700">Mật khẩu</label>
              <a href="#" onclick="alert('Tính năng khôi phục mật khẩu đang được kết nối hệ thống!')" class="text-[11px] font-semibold text-indigo-600 hover:underline">Quên mật khẩu?</a>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </div>
              <input 
                type="password" 
                id="login-password" 
                name="password"
                required 
                placeholder="••••••••" 
                class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white transition-all"
              />
              <button 
                type="button" 
                onclick="togglePasswordVisibility('login-password')" 
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600"
              >
                <svg id="eye-icon-login-password" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="flex items-center">
            <input type="checkbox" id="remember-me" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500" />
            <label for="remember-me" class="ml-2 text-xs text-slate-600">Ghi nhớ đăng nhập</label>
          </div>

          <button 
            type="submit" 
            class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md shadow-indigo-100 transition-all"
          >
            Đăng nhập vào tài khoản
          </button>
        </form>

        <!-- ─── FORM ĐĂNG KÝ ──────────────────────────────────────────────── -->
        <form id="register-form" onsubmit="handleRegisterSubmit(event)" class="space-y-3.5 hidden">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Họ và tên</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <input 
                type="text" 
                id="reg-name" 
                name="name"
                required 
                placeholder="Nguyễn Văn A" 
                class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Địa chỉ Email</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              </div>
              <input 
                type="email" 
                id="reg-email" 
                name="email"
                required 
                placeholder="vana@example.com" 
                class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Số điện thoại</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              </div>
              <input 
                type="tel" 
                id="reg-phone" 
                name="phone"
                required 
                placeholder="0912 345 678" 
                class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Mật khẩu</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </div>
              <input 
                type="password" 
                id="reg-password" 
                name="password"
                required 
                placeholder="Tối thiểu 6 ký tự" 
                class="w-full pl-10 pr-10 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white"
              />
              <button 
                type="button" 
                onclick="togglePasswordVisibility('reg-password')" 
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600"
              >
                <svg id="eye-icon-reg-password" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="flex items-start">
            <input type="checkbox" id="reg-agree" required class="mt-0.5 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500" />
            <label for="reg-agree" class="ml-2 text-xs text-slate-600 leading-tight">
              Tôi đồng ý với <a href="#" class="text-indigo-600 underline">Điều khoản dịch vụ</a> và Chính sách bảo mật của EventVN.
            </label>
          </div>

          <button 
            type="submit" 
            class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md shadow-indigo-100 transition-all"
          >
            Đăng ký tài khoản Thành viên
          </button>
        </form>

        <!-- ─── TÀI KHOẢN DEMO 1-CHẠM ───────────────────────────────────────── -->
        <div class="mt-8 pt-6 border-t border-slate-200">
          <div class="text-center mb-3">
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Tài khoản Demo 1-chạm</span>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <!-- Nút Demo Admin  -->
            <button 
              type="button" 
              onclick="demoLogin('thuha@email.com', 'admin123')"
              class="p-2.5 rounded-xl border border-purple-200 bg-purple-50/60 hover:bg-purple-100/70 text-left transition-all group"
            >
              <div class="flex items-center gap-1.5 mb-1">
                <span class="w-2 h-2 rounded-full bg-purple-600"></span>
                <span class="text-xs font-bold text-purple-900">👑 Admin</span>
              </div>
              <div class="text-[11px] text-slate-600 truncate">Lê Thị Thu Hà</div>
              <div class="text-[10px] text-purple-700 font-mono">Có nút Admin</div>
            </button>

            <!-- Nút Demo User -->
            <button 
              type="button" 
              onclick="demoLogin('minhanh@email.com', 'user123')"
              class="p-2.5 rounded-xl border border-emerald-200 bg-emerald-50/60 hover:bg-emerald-100/70 text-left transition-all group"
            >
              <div class="flex items-center gap-1.5 mb-1">
                <span class="w-2 h-2 rounded-full bg-emerald-600"></span>
                <span class="text-xs font-bold text-emerald-900">👤 Thành viên</span>
              </div>
              <div class="text-[11px] text-slate-600 truncate">Nguyễn Minh Anh</div>
              <div class="text-[10px] text-slate-500 font-mono">Không có nút Admin</div>
            </button>
          </div>
        </div>

      </div>
    </main>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
      // Kiểm tra tham số URL ?mode=register
      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("mode") === "register") {
          switchAuthTab("register");
        }
      });

      function switchAuthTab(mode) {
        const loginBtn = document.getElementById("tab-login-btn");
        const regBtn = document.getElementById("tab-register-btn");
        const loginForm = document.getElementById("login-form");
        const regForm = document.getElementById("register-form");
        const alertBox = document.getElementById("auth-alert");
        alertBox.classList.add("hidden");

        if (mode === "login") {
          loginBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition-all bg-white text-indigo-700 shadow-sm";
          regBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all";
          loginForm.classList.remove("hidden");
          regForm.classList.add("hidden");
        } else {
          regBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition-all bg-white text-indigo-700 shadow-sm";
          loginBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all";
          regForm.classList.remove("hidden");
          loginForm.classList.add("hidden");
        }
      }

      function togglePasswordVisibility(inputId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById("eye-icon-" + inputId);
        if (!input) return;
        if (input.type === "password") {
          input.type = "text";
          if (icon) {
            icon.innerHTML = `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>`;
          }
        } else {
          input.type = "password";
          if (icon) {
            icon.innerHTML = `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>`;
          }
        }
      }

      function showAlert(msg, isSuccess = false) {
        const alertBox = document.getElementById("auth-alert");
        alertBox.className = `mb-5 p-3.5 rounded-xl text-xs font-medium border animate-slide-up ${
          isSuccess ? "bg-emerald-50 text-emerald-800 border-emerald-200" : "bg-rose-50 text-rose-800 border-rose-200"
        }`;
        alertBox.textContent = msg;
        alertBox.classList.remove("hidden");
      }

      function handleLoginSubmit(e) {
        e.preventDefault();
        const email = document.getElementById("login-email").value;
        const pass = document.getElementById("login-password").value;

        const res = login(email, pass);
        if (res.success) {
          showAlert("Đăng nhập thành công! Đang chuyển hướng...", true);
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get("redirect") || "index.html";
          setTimeout(() => {
            window.location.href = redirect;
          }, 600);
        } else {
          showAlert(res.message, false);
        }
      }

      function handleRegisterSubmit(e) {
        e.preventDefault();
        const name = document.getElementById("reg-name").value;
        const email = document.getElementById("reg-email").value;
        const phone = document.getElementById("reg-phone").value;
        const pass = document.getElementById("reg-password").value;

        if (pass.length < 6) {
          showAlert("Mật khẩu phải có ít nhất 6 ký tự!", false);
          return;
        }

        const res = register(name, email, phone, pass);
        if (res.success) {
          showAlert("Đăng ký thành công! Đang chuyển hướng...", true);
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get("redirect") || "index.html";
          setTimeout(() => {
            window.location.href = redirect;
          }, 600);
        } else {
          showAlert(res.message, false);
        }
      }

      function demoLogin(email, pass) {
        document.getElementById("login-email").value = email;
        document.getElementById("login-password").value = pass;
        switchAuthTab("login");
        const res = login(email, pass);
        if (res.success) {
          showAlert(`Đăng nhập thành công tài khoản [${res.user.role.toUpperCase()}]! Đang chuyển hướng...`, true);
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get("redirect") || (res.user.role === "admin" ? "admin.html" : "index.html");
          setTimeout(() => {
            window.location.href = redirect;
          }, 600);
        }
      }
    </script>
  </body>
</html>
