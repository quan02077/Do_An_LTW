<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài Khoản - Basau Bags</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 CSS (Đường dẫn tương đối cho wwwroot) -->
    <link href="bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS (Đường dẫn tương đối cho wwwroot) -->
    <link rel="stylesheet" href="stylesMain.css">
    <link rel="stylesheet" href="stylesLogin.css">
</head>

<body>

    <!-- ========================================================================== -->
    <!-- [BLOCK: HEADER / THANH TIÊU ĐỀ TRANG XÁC THỰC]                            -->
    <!-- Hướng dẫn tách _Layout.cshtml:                                             -->
    <!--   - Dùng chung _Header.cshtml hoặc tạo layout riêng _AuthLayout            -->
    <!-- ========================================================================== -->
    <header class="auth-header site-header">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="homePage.html" class="auth-brand">
                BASAU<span class="text-danger">.BAGS</span>
            </a>
            <a href="homePage.html" class="btn btn-outline-dark btn-sm rounded-pill px-3 fw-bold">
                Trang chủ
            </a>
        </div>
    </header>
    <!-- [/BLOCK: HEADER] -->

    <!-- ========================================================================== -->
    <!-- [BLOCK: MAIN CONTENT / FORM ĐĂNG NHẬP, ĐĂNG KÝ, QUÊN MẬT KHẨU]             -->
    <!-- Hướng dẫn tách _Layout.cshtml:                                             -->
    <!--   - Toàn bộ nội dung khối này tương ứng với @RenderBody() trong _Layout   -->
    <!--   - Khi tạo View Login.cshtml, chỉ giữ lại phần nội dung bên trong <main>  -->
    <!-- ========================================================================== -->
    <main class="site-main container my-5 py-3">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">

                <div class="login-card">
                    <div class="text-center mb-4 pb-2 border-bottom">
                        <h1 class="fw-bold oswald-font mb-1" id="pageTitle" style="font-size: 1.8rem; line-height: 1.4;">ĐĂNG NHẬP</h1>
                        <p class="text-secondary small mb-2">Truy cập tài khoản mua sắm và quản lý đơn hàng</p>
                    </div>

                    <!-- FORM ĐĂNG NHẬP -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label text-uppercase d-block" for="username">Tên đăng nhập hoặc Email *</label>
                            <input type="text" class="form-control" id="username" placeholder="Nhập username hoặc email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-uppercase d-block" for="password">Mật khẩu *</label>
                            <input type="password" class="form-control password-field" id="password" placeholder="Mật khẩu của bạn">
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input custom-switch" type="checkbox" role="switch"
                                id="showPassLogin" onchange="togglePassword(this)">
                            <label class="form-check-label small" for="showPassLogin">Hiển thị mật khẩu</label>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-uppercase d-block" for="roleSelection">Vai trò truy cập *</label>
                            <select class="form-select" id="roleSelection">
                                <option value="Khách hàng" selected>Khách hàng mua sắm</option>
                                <option value="Người bán">Người bán (Quản trị viên)</option>
                            </select>
                        </div>

                        <button type="button" class="btn btn-dark w-100 fw-bold py-3 rounded-pill shadow-sm" id="loginBtn"
                            onclick="login()">ĐĂNG NHẬP</button>

                        <div class="d-flex justify-content-between mt-4 pt-2 border-top small">
                            <a href="#" class="text-dark text-decoration-none fw-bold" onclick="showRegisterForm()">Tạo tài khoản mới</a>
                            <a href="#" class="text-secondary text-decoration-none" onclick="showForgotForm()">Quên mật khẩu?</a>
                        </div>
                    </form>

                    <!-- FORM QUÊN MẬT KHẨU -->
                    <form id="forgotForm" class="d-none">
                        <div class="mb-3">
                            <label class="form-label text-uppercase d-block" for="forgotUsername">Tên đăng nhập hoặc Email *</label>
                            <input type="text" class="form-control" id="forgotUsername"
                                placeholder="Nhập username hoặc email cần tìm">
                        </div>

                        <div id="passBox" class="d-none flex-column w-100">
                            <div class="mb-3">
                                <label class="form-label text-uppercase d-block" for="newPassword">Mật khẩu mới *</label>
                                <input type="password" class="form-control password-field" id="newPassword"
                                    placeholder="Nhập mật khẩu mới">
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-uppercase d-block" for="confirmPassword">Xác nhận mật khẩu *</label>
                                <input type="password" class="form-control password-field" id="confirmPassword"
                                    placeholder="Xác nhận mật khẩu mới">
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input custom-switch" type="checkbox" role="switch"
                                    id="showPassForgot" onchange="togglePassword(this)">
                                <label class="form-check-label small" for="showPassForgot">Xem mật khẩu mới</label>
                            </div>
                        </div>

                        <button type="button" class="btn btn-dark w-100 fw-bold py-3 mt-2 rounded-pill shadow-sm" id="forgotBtn"
                            onclick="forgotPassword()">TIẾP TỤC</button>
                        <div class="text-center mt-4 pt-2 border-top small">
                            <a href="#" class="text-dark text-decoration-none fw-bold" onclick="showLoginForm()">Quay lại đăng nhập</a>
                        </div>
                    </form>

                    <!-- FORM ĐĂNG KÝ -->
                    <form id="registerForm" class="d-none">
                        <div class="mb-3">
                            <label class="form-label text-uppercase d-block" for="registerEmail">Địa chỉ Email *</label>
                            <input type="email" class="form-control" id="registerEmail" placeholder="VD: email@gmail.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-uppercase d-block" for="registerUsername">Tên đăng nhập *</label>
                            <input type="text" class="form-control" id="registerUsername" placeholder="Nhập tên đăng nhập">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-uppercase d-block" for="registerPassword">Mật khẩu *</label>
                            <input type="password" class="form-control password-field" id="registerPassword"
                                placeholder="Tối thiểu 6 ký tự">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-uppercase d-block" for="registerConfirmPassword">Xác nhận mật khẩu *</label>
                            <input type="password" class="form-control password-field" id="registerConfirmPassword"
                                placeholder="Nhập lại mật khẩu">
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input custom-switch" type="checkbox" role="switch"
                                id="showPassReg" onchange="togglePassword(this)">
                            <label class="form-check-label small" for="showPassReg">Hiển thị ký tự</label>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-uppercase d-block" for="registerRoleSelection">Vai trò đăng ký *</label>
                            <select class="form-select" id="registerRoleSelection">
                                <option value="Khách hàng" selected>Khách hàng mua sắm</option>
                                <option value="Người bán">Người bán</option>
                            </select>
                        </div>

                        <button type="button" class="btn btn-dark w-100 fw-bold py-3 rounded-pill shadow-sm" id="registerBtn"
                            onclick="register()">ĐĂNG KÝ TÀI KHOẢN</button>
                        <div class="text-center mt-4 pt-2 border-top small">
                            <a href="#" class="text-dark text-decoration-none fw-bold" onclick="showLoginForm()">Đã có tài khoản? Đăng nhập</a>
                        </div>
                    </form>

                </div>

            </div>
        </div>
    </main>
    <!-- [/BLOCK: MAIN CONTENT] -->

    <!-- ========================================================================== -->
    <!-- [BLOCK: SCRIPTS / THƯ VIỆN & SCRIPT XÁC THỰC]                              -->
    <!-- Hướng dẫn tách _Layout.cshtml:                                             -->
    <!--   - Đưa vào @section Scripts { ... } trong View Login.cshtml               -->
    <!-- ========================================================================== -->
    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- [/BLOCK: SCRIPTS] -->
</body>

</html>
