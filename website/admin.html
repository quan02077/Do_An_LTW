<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảng Quản trị — EventVN Admin Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#4338CA',
                hover: '#3730A3',
                light: '#EEF2FF',
              }
            },
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
    <!-- Navbar Header -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <a href="admin.html" class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-purple-600 flex items-center justify-center text-white font-black text-lg shadow-md shadow-purple-200">
              A
            </div>
            <div>
              <span class="text-lg font-black tracking-tight text-slate-900">EventVN <span class="text-purple-600 text-sm font-bold">Admin</span></span>
            </div>
          </a>
        </div>

        <div class="flex items-center gap-3">
          <!-- Nút chuyển Người dùng / Admin -->
          <div class="navbar-role-switcher"></div>
          <!-- Avatar -->
          <div class="navbar-auth-container"></div>
        </div>
      </div>
    </header>

    <!-- Main Admin Body -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-8">
      
      <!-- Top Overview Stats -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="admin-stats-grid">
        <!-- Rendered by JS -->
      </div>

      <!-- Navigation Tabs & Action -->
      <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-4">
          <!-- Admin Tabs -->
          <div class="flex items-center gap-2 overflow-x-auto">
            <button onclick="switchAdminTab('events')" id="adm-tab-events" class="px-4 py-2 rounded-xl text-xs font-bold transition-all bg-purple-600 text-white shadow-sm">
              Quản lý sự kiện
            </button>
            <button onclick="switchAdminTab('registrations')" id="adm-tab-registrations" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition-all">
              Duyệt đăng ký vé
            </button>
            <button onclick="switchAdminTab('categories')" id="adm-tab-categories" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition-all">
              Danh mục sự kiện
            </button>
          </div>

          <!-- Add Event Button -->
          <div id="admin-action-btn-container">
            <button onclick="openAddEventModal()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center gap-1.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              <span>Thêm sự kiện mới</span>
            </button>
          </div>
        </div>

        <!-- ─── TAB 1: QUẢN LÝ SỰ KIỆN ─────────────────────────────────────── -->
        <div id="adm-view-events" class="space-y-4">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-600">
              <thead class="bg-slate-50 text-slate-800 font-bold border-b border-slate-200 uppercase text-[10px] tracking-wider">
                <tr>
                  <th class="py-3 px-4">Sự kiện</th>
                  <th class="py-3 px-4">Danh mục</th>
                  <th class="py-3 px-4">Thời gian</th>
                  <th class="py-3 px-4">Địa điểm</th>
                  <th class="py-3 px-4">Đăng ký</th>
                  <th class="py-3 px-4">Trạng thái</th>
                  <th class="py-3 px-4 text-right">Thao tác</th>
                </tr>
              </thead>
              <tbody id="admin-events-tbody" class="divide-y divide-slate-100">
                <!-- Render dynamically -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- ─── TAB 2: DUYỆT ĐĂNG KÝ VÉ ───────────────────────────────────── -->
        <div id="adm-view-registrations" class="space-y-4 hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-600">
              <thead class="bg-slate-50 text-slate-800 font-bold border-b border-slate-200 uppercase text-[10px] tracking-wider">
                <tr>
                  <th class="py-3 px-4">Mã vé</th>
                  <th class="py-3 px-4">Người tham dự</th>
                  <th class="py-3 px-4">Sự kiện</th>
                  <th class="py-3 px-4">Ngày đăng ký</th>
                  <th class="py-3 px-4">Ghi chú</th>
                  <th class="py-3 px-4">Trạng thái</th>
                  <th class="py-3 px-4 text-right">Thao tác</th>
                </tr>
              </thead>
              <tbody id="admin-regs-tbody" class="divide-y divide-slate-100">
                <!-- Render dynamically -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- ─── TAB 3: DANH MỤC SỰ KIỆN ──────────────────────────────────── -->
        <div id="adm-view-categories" class="space-y-4 hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-600">
              <thead class="bg-slate-50 text-slate-800 font-bold border-b border-slate-200 uppercase text-[10px] tracking-wider">
                <tr>
                  <th class="py-3 px-4">ID</th>
                  <th class="py-3 px-4">Tên danh mục</th>
                  <th class="py-3 px-4">Mô tả</th>
                  <th class="py-3 px-4">Số lượng sự kiện</th>
                  <th class="py-3 px-4">Trạng thái</th>
                </tr>
              </thead>
              <tbody id="admin-cats-tbody" class="divide-y divide-slate-100">
                <!-- Render dynamically -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>

    <!-- ─── Modal Thêm Sự Kiện ──────────────────────────────────────────────── -->
    <div id="add-event-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 border border-slate-200 shadow-2xl animate-slide-up relative max-h-[90vh] overflow-y-auto">
        <button type="button" onclick="closeAddEventModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>

        <h2 class="text-lg font-black text-slate-900 mb-4">Thêm sự kiện mới</h2>

        <form onsubmit="handleCreateEvent(event)" class="space-y-4 text-xs">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Tên sự kiện</label>
            <input type="text" id="new-ev-title" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl" placeholder="Ví dụ: AI Summit 2026..." />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Danh mục</label>
              <select id="new-ev-category" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl">
                <!-- Filled dynamically -->
              </select>
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Quy mô chỗ ngồi</label>
              <input type="number" id="new-ev-capacity" required value="200" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Bắt đầu</label>
              <input type="datetime-local" id="new-ev-start" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Kết thúc</label>
              <input type="datetime-local" id="new-ev-end" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl" />
            </div>
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">Địa điểm tổ chức</label>
            <input type="text" id="new-ev-location" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl" placeholder="Trung tâm hội nghị..." />
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">Link ảnh thumbnail</label>
            <input type="url" id="new-ev-image" required value="https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=800" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl" />
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">Mô tả sự kiện</label>
            <textarea id="new-ev-desc" rows="3" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl" placeholder="Nội dung tóm tắt..."></textarea>
          </div>

          <div class="pt-3 border-t border-slate-100 flex gap-2">
            <button type="button" onclick="closeAddEventModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl">Hủy</button>
            <button type="submit" class="flex-1 py-2.5 bg-purple-600 text-white font-bold rounded-xl hover:bg-purple-700 shadow-sm">Tạo sự kiện</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
      let currentAdminTab = "events";

      document.addEventListener("DOMContentLoaded", () => {
        // Kiểm tra phân quyền: Chỉ cho phép tài khoản có role === 'admin'
        if (!requireAdmin()) return;

        renderStats();
        renderAdminEvents();
        renderAdminRegistrations();
        renderAdminCategories();
        populateCategorySelect();
      });

      function renderStats() {
        const events = getEvents();
        const regs = getRegistrations();
        const users = getUsers();

        const totalEvents = events.length;
        const upcomingEvents = events.filter((e) => e.status === "upcoming").length;
        const totalRegs = regs.filter((r) => r.status === "confirmed").length;
        const totalUsers = users.length;

        document.getElementById("admin-stats-grid").innerHTML = `
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Tổng sự kiện</div>
            <div class="text-2xl font-black text-slate-900">${totalEvents}</div>
          </div>
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="text-[11px] font-bold text-emerald-600 uppercase tracking-wider mb-1">Sắp diễn ra</div>
            <div class="text-2xl font-black text-emerald-600">${upcomingEvents}</div>
          </div>
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="text-[11px] font-bold text-purple-600 uppercase tracking-wider mb-1">Vé đã đăng ký</div>
            <div class="text-2xl font-black text-purple-600">${totalRegs}</div>
          </div>
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="text-[11px] font-bold text-indigo-600 uppercase tracking-wider mb-1">Thành viên</div>
            <div class="text-2xl font-black text-indigo-600">${totalUsers}</div>
          </div>
        `;
      }

      function switchAdminTab(tab) {
        currentAdminTab = tab;
        const tabs = ["events", "registrations", "categories"];
        tabs.forEach((t) => {
          const btn = document.getElementById("adm-tab-" + t);
          const view = document.getElementById("adm-view-" + t);
          if (t === tab) {
            btn.className = "px-4 py-2 rounded-xl text-xs font-bold transition-all bg-purple-600 text-white shadow-sm";
            view.classList.remove("hidden");
          } else {
            btn.className = "px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition-all";
            view.classList.add("hidden");
          }
        });
      }

      function renderAdminEvents() {
        const events = getEvents();
        const categories = getCategories();
        const tbody = document.getElementById("admin-events-tbody");

        let html = "";
        events.forEach((ev) => {
          const cat = categories.find((c) => c.id === ev.categoryId) || { name: "Chung" };
          html += `
            <tr class="hover:bg-slate-50 transition-colors">
              <td class="py-3 px-4">
                <div class="flex items-center gap-3">
                  <img src="${ev.image}" class="w-10 h-10 rounded-lg object-cover" />
                  <span class="font-bold text-slate-900">${ev.title}</span>
                </div>
              </td>
              <td class="py-3 px-4 font-medium">${cat.name}</td>
              <td class="py-3 px-4">${fmtDateTime(ev.startDate)}</td>
              <td class="py-3 px-4 max-w-xs truncate">${ev.location}</td>
              <td class="py-3 px-4 font-semibold">${ev.registered}/${ev.capacity}</td>
              <td class="py-3 px-4">${getStatusBadge(ev.status)}</td>
              <td class="py-3 px-4 text-right">
                <button onclick="deleteEvent(${ev.id})" class="p-1.5 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded-lg" title="Xóa">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }

      function renderAdminRegistrations() {
        const regs = getRegistrations();
        const users = getUsers();
        const events = getEvents();
        const tbody = document.getElementById("admin-regs-tbody");

        let html = "";
        regs.forEach((r) => {
          const user = users.find((u) => u.id === r.userId) || { name: "Khách", email: "N/A" };
          const ev = events.find((e) => e.id === r.eventId) || { title: "Sự kiện #" + r.eventId };

          html += `
            <tr class="hover:bg-slate-50 transition-colors">
              <td class="py-3 px-4 font-mono font-bold text-slate-800">EVN-2026-${r.id.toString().slice(-4)}</td>
              <td class="py-3 px-4">
                <div class="font-bold text-slate-900">${user.name}</div>
                <div class="text-[11px] text-slate-400 font-mono">${user.email}</div>
              </td>
              <td class="py-3 px-4 max-w-xs truncate font-medium text-slate-800">${ev.title}</td>
              <td class="py-3 px-4">${fmtDateTime(r.registeredAt)}</td>
              <td class="py-3 px-4 text-slate-400 italic">${r.notes || "Không có"}</td>
              <td class="py-3 px-4">${getStatusBadge(r.status)}</td>
              <td class="py-3 px-4 text-right">
                ${
                  r.status !== "confirmed"
                    ? `<button onclick="updateRegStatus(${r.id}, 'confirmed')" class="px-2.5 py-1 bg-emerald-50 text-emerald-700 font-bold rounded-lg hover:bg-emerald-100 mr-1">Duyệt</button>`
                    : ""
                }
                ${
                  r.status !== "cancelled"
                    ? `<button onclick="updateRegStatus(${r.id}, 'cancelled')" class="px-2.5 py-1 bg-rose-50 text-rose-700 font-bold rounded-lg hover:bg-rose-100">Hủy</button>`
                    : ""
                }
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }

      function renderAdminCategories() {
        const categories = getCategories();
        const events = getEvents();
        const tbody = document.getElementById("admin-cats-tbody");

        let html = "";
        categories.forEach((cat) => {
          const count = events.filter((e) => e.categoryId === cat.id).length;
          html += `
            <tr class="hover:bg-slate-50 transition-colors">
              <td class="py-3 px-4 font-mono">${cat.id}</td>
              <td class="py-3 px-4 font-bold text-slate-900">${cat.name}</td>
              <td class="py-3 px-4 text-slate-500">${cat.description}</td>
              <td class="py-3 px-4 font-semibold">${count} sự kiện</td>
              <td class="py-3 px-4">
                <span class="inline-flex px-2 py-0.5 text-[10px] font-bold rounded-full ${cat.active ? "bg-emerald-50 text-emerald-700" : "bg-slate-100 text-slate-500"}">
                  ${cat.active ? "Hoạt động" : "Tạm dừng"}
                </span>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }

      function populateCategorySelect() {
        const select = document.getElementById("new-ev-category");
        const categories = getCategories();
        select.innerHTML = categories.map((c) => `<option value="${c.id}">${c.name}</option>`).join("");
      }

      function openAddEventModal() {
        document.getElementById("add-event-modal").classList.remove("hidden");
      }

      function closeAddEventModal() {
        document.getElementById("add-event-modal").classList.add("hidden");
      }

      function handleCreateEvent(e) {
        e.preventDefault();
        const title = document.getElementById("new-ev-title").value.trim();
        const catId = Number(document.getElementById("new-ev-category").value);
        const capacity = Number(document.getElementById("new-ev-capacity").value);
        const start = document.getElementById("new-ev-start").value;
        const end = document.getElementById("new-ev-end").value;
        const location = document.getElementById("new-ev-location").value.trim();
        const image = document.getElementById("new-ev-image").value.trim();
        const desc = document.getElementById("new-ev-desc").value.trim();

        const events = getEvents();
        const newEv = {
          id: Date.now(),
          title,
          categoryId: catId,
          image,
          startDate: start,
          endDate: end,
          location,
          description: desc,
          capacity,
          registered: 0,
          status: "upcoming",
          featured: false,
        };

        events.unshift(newEv);
        saveEvents(events);
        closeAddEventModal();
        renderStats();
        renderAdminEvents();
        showToast("Đã thêm sự kiện mới thành công!", "success");
      }

      function deleteEvent(id) {
        if (!confirm("Bạn có chắc chắn muốn xóa sự kiện này?")) return;
        let events = getEvents();
        events = events.filter((e) => e.id !== id);
        saveEvents(events);
        renderStats();
        renderAdminEvents();
        showToast("Đã xóa sự kiện!", "info");
      }

      function updateRegStatus(regId, status) {
        const regs = getRegistrations();
        const idx = regs.findIndex((r) => r.id === regId);
        if (idx !== -1) {
          regs[idx].status = status;
          saveRegistrations(regs);
          renderAdminRegistrations();
          renderStats();
          showToast(`Đã cập nhật trạng thái vé thành [${status === "confirmed" ? "Đã duyệt" : "Đã hủy"}]`, "success");
        }
      }
    </script>
  </body>
</html>
