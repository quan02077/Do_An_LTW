<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vé & Sự kiện của tôi — EventVN</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#4338CA',
                hover: '#3730A3',
                light: '#EEF2FF',
              }
            },
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
    <!-- Navbar Header -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
        <a href="index.html" class="flex items-center gap-2.5 flex-shrink-0">
          <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-lg shadow-md shadow-indigo-200">
            E
          </div>
          <span class="text-lg font-black tracking-tight text-slate-900">Event<span class="text-indigo-600">VN</span></span>
        </a>

        <nav class="hidden md:flex items-center gap-1">
          <a href="index.html" class="px-3 py-2 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors">Trang chủ</a>
          <a href="dashboard.html" class="px-3 py-2 rounded-lg text-xs font-bold text-indigo-600 bg-indigo-50">Vé của tôi</a>
          <a href="dashboard.html?tab=bookmarks" class="px-3 py-2 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-rose-500 fill-rose-500" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            <span>Yêu thích</span>
            <span class="bookmark-count-badge hidden ml-0.5 px-1.5 py-0.2 rounded-full text-[10px] font-bold bg-rose-500 text-white">0</span>
          </a>
          <a href="profile.html" class="px-3 py-2 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors">Hồ sơ cá nhân</a>
        </nav>

        <div class="flex items-center gap-3">
          <div class="navbar-role-switcher hidden"></div>
          <div class="navbar-auth-container"></div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full" id="dashboard-main">
      <!-- Kiểm tra trạng thái đăng nhập -->
      <div id="unauth-view" class="hidden max-w-md mx-auto text-center py-16 bg-white rounded-3xl border border-slate-200 shadow-sm p-8">
        <div class="w-16 h-16 mx-auto mb-4 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
        <h2 class="text-xl font-black text-slate-900 mb-2">Đăng nhập tài khoản</h2>
        <p class="text-xs text-slate-500 mb-6 leading-relaxed">
          Vui lòng đăng nhập để xem danh sách vé điện tử đã đăng ký và các sự kiện yêu thích của bạn.
        </p>
        <div class="flex gap-3">
          <a href="auth.html" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition-all">
            Đăng nhập
          </a>
          <a href="auth.html?mode=register" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-all">
            Đăng ký
          </a>
        </div>
      </div>

      <!-- Giao diện khi đã đăng nhập -->
      <div id="auth-view" class="space-y-6">
        <!-- Profile Banner -->
        <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-6">
          <div class="flex items-center gap-4">
            <div id="dash-avatar" class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 text-white font-black text-xl flex items-center justify-center shadow-md">
              U
            </div>
            <div>
              <div class="flex items-center gap-2 mb-1">
                <h1 id="dash-name" class="text-xl font-black text-slate-900"></h1>
                <span id="dash-role-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold"></span>
              </div>
              <div class="flex flex-wrap gap-4 text-xs text-slate-500">
                <span id="dash-email"></span>
                <span>•</span>
                <span id="dash-phone"></span>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-3">
            <a href="profile.html" class="px-4 py-2 text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">
              Chỉnh sửa hồ sơ
            </a>
            <button onclick="logout()" class="px-4 py-2 text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl transition-colors">
              Đăng xuất
            </button>
          </div>
        </div>

        <!-- Dashboard Tabs: Vé đã đăng ký vs Sự kiện Yêu thích -->
        <div class="flex border-b border-slate-200 gap-6 text-sm font-semibold">
          <button id="tab-tickets-btn" onclick="switchDashTab('tickets')" class="pb-3 border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2">
            <span>Vé đã đăng ký</span>
            <span id="tickets-count-badge" class="px-2 py-0.5 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700">0</span>
          </button>
          <button id="tab-bookmarks-btn" onclick="switchDashTab('bookmarks')" class="pb-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2">
            <svg class="w-4 h-4 text-rose-500 fill-rose-500" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            <span>Sự kiện Yêu thích</span>
            <span id="bookmarks-tab-count" class="px-2 py-0.5 rounded-full text-xs font-bold bg-rose-50 text-rose-700">0</span>
          </button>
        </div>

        <!-- Nội dung Tab 1: Danh sách vé -->
        <div id="tickets-container" class="space-y-4">
          <!-- Render dynamically -->
        </div>

        <!-- Nội dung Tab 2: Sự kiện Yêu thích -->
        <div id="bookmarks-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
          <!-- Render dynamically -->
        </div>
      </div>
    </main>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
      let currentDashTab = "tickets";

      document.addEventListener("DOMContentLoaded", () => {
        const user = getCurrentUser();
        const unauthView = document.getElementById("unauth-view");
        const authView = document.getElementById("auth-view");

        if (!user) {
          unauthView.classList.remove("hidden");
          authView.classList.add("hidden");
          return;
        }

        unauthView.classList.add("hidden");
        authView.classList.remove("hidden");

        // Profile Info
        document.getElementById("dash-avatar").textContent = user.avatar || "U";
        document.getElementById("dash-name").textContent = user.name;
        document.getElementById("dash-email").textContent = user.email;
        document.getElementById("dash-phone").textContent = user.phone;

        const roleBadge = document.getElementById("dash-role-badge");
        if (user.role === "admin") {
          roleBadge.textContent = "Quản trị viên (Admin)";
          roleBadge.className = "px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-purple-50 text-purple-700 border border-purple-200";
        } else {
          roleBadge.textContent = "Thành viên";
          roleBadge.className = "px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200";
        }

        // Kiểm tra query parameter ?tab=bookmarks
        const params = new URLSearchParams(window.location.search);
        if (params.get("tab") === "bookmarks") {
          currentDashTab = "bookmarks";
        }

        renderTickets();
        renderBookmarks();
        updateTabStyles();
      });

      function switchDashTab(tab) {
        currentDashTab = tab;
        updateTabStyles();
      }

      function updateTabStyles() {
        const ticketsBtn = document.getElementById("tab-tickets-btn");
        const bookmarksBtn = document.getElementById("tab-bookmarks-btn");
        const ticketsBox = document.getElementById("tickets-container");
        const bookmarksBox = document.getElementById("bookmarks-container");

        if (currentDashTab === "tickets") {
          ticketsBtn.className = "pb-3 border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2 font-bold";
          bookmarksBtn.className = "pb-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2";
          ticketsBox.classList.remove("hidden");
          bookmarksBox.classList.add("hidden");
        } else {
          bookmarksBtn.className = "pb-3 border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2 font-bold";
          ticketsBtn.className = "pb-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2";
          bookmarksBox.classList.remove("hidden");
          ticketsBox.classList.add("hidden");
        }
      }

      function renderTickets() {
        const user = getCurrentUser();
        const regs = getRegistrations().filter((r) => r.userId === user.id);
        const events = getEvents();
        const container = document.getElementById("tickets-container");
        document.getElementById("tickets-count-badge").textContent = regs.length;

        if (regs.length === 0) {
          container.innerHTML = `
            <div class="text-center py-12 bg-white rounded-3xl border border-slate-200 p-8">
              <div class="w-12 h-12 mx-auto mb-3 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
              </div>
              <h3 class="text-base font-bold text-slate-800 mb-1">Bạn chưa đăng ký sự kiện nào</h3>
              <p class="text-xs text-slate-500 mb-4">Hãy khám phá các sự kiện hấp dẫn và đăng ký tham gia ngay hôm nay.</p>
              <a href="index.html" class="inline-block px-4 py-2.5 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow-sm">
                Khám phá sự kiện
              </a>
            </div>
          `;
          return;
        }

        let html = "";
        regs.forEach((reg) => {
          const ev = events.find((e) => e.id === reg.eventId) || {
            title: "Sự kiện #" + reg.eventId,
            image: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=500",
            startDate: reg.registeredAt,
            location: "Đang cập nhật",
          };

          html += `
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div class="flex items-center gap-4">
                <img src="${ev.image}" class="w-20 h-20 rounded-xl object-cover flex-shrink-0" />
                <div>
                  <div class="flex items-center gap-2 mb-1">
                    <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700">EVN-2026-${reg.id.toString().slice(-4)}</span>
                    ${getStatusBadge(reg.status)}
                  </div>
                  <h3 class="text-base font-bold text-slate-900 leading-tight mb-1">
                    <a href="event-detail.html?id=${ev.id}" class="hover:text-indigo-600">${ev.title}</a>
                  </h3>
                  <div class="flex flex-wrap gap-3 text-xs text-slate-500">
                    <span>${fmtDateTime(ev.startDate)}</span>
                    <span>•</span>
                    <span>${ev.location}</span>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2 w-full sm:w-auto pt-3 sm:pt-0 border-t sm:border-t-0 border-slate-100">
                <a href="event-detail.html?id=${ev.id}" class="flex-1 sm:flex-initial px-4 py-2 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 rounded-xl text-xs font-bold transition-colors text-center">
                  Xem sự kiện
                </a>
                ${
                  reg.status !== "cancelled"
                    ? `<button onclick="cancelRegistration(${reg.id})" class="flex-1 sm:flex-initial px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-bold transition-colors">Hủy vé</button>`
                    : ""
                }
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
      }

      function renderBookmarks() {
        const bookmarks = getBookmarks();
        const events = getEvents().filter((e) => bookmarks.includes(e.id));
        const container = document.getElementById("bookmarks-container");
        document.getElementById("bookmarks-tab-count").textContent = events.length;

        if (events.length === 0) {
          container.innerHTML = `
            <div class="col-span-full text-center py-12 bg-white rounded-3xl border border-slate-200 p-8">
              <div class="w-12 h-12 mx-auto mb-3 bg-rose-50 text-rose-400 rounded-full flex items-center justify-center">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
              </div>
              <h3 class="text-base font-bold text-slate-800 mb-1">Chưa có sự kiện yêu thích nào</h3>
              <p class="text-xs text-slate-500 mb-4">Bấm vào biểu tượng Trái tim trên bất kỳ sự kiện nào để lưu lại tại đây.</p>
              <a href="index.html" class="inline-block px-4 py-2.5 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow-sm">
                Khám phá ngay
              </a>
            </div>
          `;
          return;
        }

        let html = "";
        events.forEach((ev) => {
          html += `
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm flex flex-col justify-between">
              <div class="relative h-40">
                <img src="${ev.image}" class="w-full h-full object-cover" />
                <button 
                  onclick="removeBookmarkFromDash(${ev.id})"
                  class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/90 backdrop-blur-sm flex items-center justify-center shadow-sm text-rose-500 hover:scale-110 transition-transform"
                  title="Bỏ lưu"
                >
                  <svg class="w-4 h-4 fill-rose-500" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                </button>
              </div>
              <div class="p-4 flex-1 flex flex-col justify-between">
                <div>
                  <div class="text-[11px] font-semibold text-indigo-600 mb-1">${fmtDateTime(ev.startDate)}</div>
                  <h4 class="font-bold text-slate-900 text-sm mb-2 line-clamp-2">${ev.title}</h4>
                  <div class="text-xs text-slate-500 line-clamp-1 mb-4">${ev.location}</div>
                </div>
                <a href="event-detail.html?id=${ev.id}" class="w-full py-2 bg-indigo-50 hover:bg-indigo-600 hover:text-white text-indigo-700 font-bold text-xs rounded-xl text-center transition-colors">
                  Xem chi tiết & Đặt vé
                </a>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
      }

      function cancelRegistration(regId) {
        if (!confirm("Bạn có chắc chắn muốn hủy đăng ký vé này?")) return;
        const regs = getRegistrations();
        const index = regs.findIndex((r) => r.id === regId);
        if (index !== -1) {
          regs[index].status = "cancelled";
          saveRegistrations(regs);
          renderTickets();
          showToast("Đã hủy đăng ký vé thành công", "info");
        }
      }

      function removeBookmarkFromDash(eventId) {
        toggleBookmark(eventId);
        renderBookmarks();
        showToast("Đã bỏ lưu sự kiện khỏi Yêu thích", "info");
      }
    </script>
  </body>
</html>
